name: Build myron Droidspaces-only GKI

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: "Restore/save Bazel cache"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: myron-droidspaces-${{ github.ref }}
  cancel-in-progress: false

env:
  # Stock target: 6.12.69-android16-6, 4 KiB pages.
  COMMON_TAG: android16-6.12-2026-03_r62
  COMMON_COMMIT: e2b8ca7c8d0551a6124b1a7322f5ae532845f1b5
  DROIDSPACES_COMMIT: 2280b592f43312254dc3c976fc01558aa1186d51
  ANYKERNEL_COMMIT: e1e9dce98430c5c6f231f7094a8c7f4ecaf50948

jobs:
  build:
    name: 6.12.69-android16-6 Droidspaces-only (4K)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"

      - name: Add swap for ThinLTO
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install repo and prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel" "$GITHUB_WORKSPACE/git-repo"
          curl --fail --location --retry 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$GITHUB_WORKSPACE/git-repo/repo"
          chmod +x "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

      - name: Sync Android 16 6.12 source
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android16-6.12-2026-03 \
            --depth=1
          cp "$GITHUB_WORKSPACE/myron/locked.xml" .repo/manifests/myron-locked.xml
          repo init -m myron-locked.xml
          repo sync -c --current-branch --no-clone-bundle --no-tags -j4
          mkdir -p "$GITHUB_WORKSPACE/out"
          repo manifest -r -o "$GITHUB_WORKSPACE/out/manifest.xml"

      - name: Verify candidate kernel/common release
        working-directory: kernel/common
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/tags/${COMMON_TAG}"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$COMMON_COMMIT" ]; then
            echo "Unexpected ${COMMON_TAG} commit: $actual" >&2
            exit 1
          fi
          echo "Pinned kernel/common: ${COMMON_TAG} (${actual})"

      - name: Resolve and apply Droidspaces 6.12 patch
        shell: bash
        run: |
          set -euo pipefail
          git init Droidspaces-OSS
          git -C Droidspaces-OSS remote add origin https://github.com/ravindu644/Droidspaces-OSS.git
          git -C Droidspaces-OSS fetch --depth=1 origin "$DROIDSPACES_COMMIT"
          git -C Droidspaces-OSS checkout --detach FETCH_HEAD
          ds_commit="$(git -C Droidspaces-OSS rev-parse HEAD)"
          test "$ds_commit" = "$DROIDSPACES_COMMIT"

          patch_file="$GITHUB_WORKSPACE/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch"
          test -f "$patch_file"
          patch --directory="$GITHUB_WORKSPACE/kernel/common" -p1 < "$patch_file"

          # Keep parity with Droidspaces' maintained Android 16/6.12 action.
          # These symbols are required by its IPC namespace integration.
          grep -q 'EXPORT_SYMBOL_GPL(put_ipc_ns);' \
            "$GITHUB_WORKSPACE/kernel/common/ipc/namespace.c" || \
            echo 'EXPORT_SYMBOL_GPL(put_ipc_ns);' >> \
              "$GITHUB_WORKSPACE/kernel/common/ipc/namespace.c"
          grep -q 'EXPORT_SYMBOL_GPL(init_ipc_ns);' \
            "$GITHUB_WORKSPACE/kernel/common/ipc/msgutil.c" || \
            echo 'EXPORT_SYMBOL_GPL(init_ipc_ns);' >> \
              "$GITHUB_WORKSPACE/kernel/common/ipc/msgutil.c"

      - name: Enable only Droidspaces-required kernel options
        working-directory: kernel/common
        shell: bash
        run: |
          set -euo pipefail
          defconfig="arch/arm64/configs/gki_defconfig"

          set_config() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" "$defconfig"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$defconfig"
            elif grep -q "^# ${key} is not set" "$defconfig"; then
              sed -i "s|^# ${key} is not set|${key}=${value}|" "$defconfig"
            else
              printf '%s=%s\n' "$key" "$value" >> "$defconfig"
            fi
          }

          set_config CONFIG_PID_NS y
          set_config CONFIG_IPC_NS y
          set_config CONFIG_SYSVIPC y
          set_config CONFIG_POSIX_MQUEUE y
          set_config CONFIG_DEVTMPFS y
          set_config CONFIG_USER_NS y
          set_config CONFIG_BINFMT_MISC y
          set_config CONFIG_BINFMT_SCRIPT y
          set_config CONFIG_BINFMT_ELF y
          set_config CONFIG_OVERLAY_FS y
          set_config CONFIG_TMPFS_XATTR y
          set_config CONFIG_TMPFS_POSIX_ACL y
          set_config CONFIG_IKCONFIG y
          set_config CONFIG_IKCONFIG_PROC y

          # These checks also ensure no KernelSU/SUSFS option was added accidentally.
          for key in CONFIG_PID_NS CONFIG_IPC_NS CONFIG_SYSVIPC \
                     CONFIG_POSIX_MQUEUE CONFIG_DEVTMPFS CONFIG_USER_NS; do
            grep -qx "${key}=y" "$defconfig"
          done
          if grep -Eq '^CONFIG_KSU(_[A-Z0-9_]+)?=' "$defconfig"; then
            echo "Unexpected built-in KernelSU/SUSFS configuration" >&2
            exit 1
          fi

      - name: Configure Bazel cache
        if: inputs.use_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: myron-gki-${{ env.COMMON_TAG }}-${{ hashFiles('.github/workflows/myron-droidspaces-only.yml') }}
          restore-keys: |
            myron-gki-${{ env.COMMON_TAG }}-

      - name: Build 4K arm64 Image
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          # Do not rewrite scripts/setlocalversion: preserving the Android KMI
          # release string is important for the existing vendor and KSU LKM modules.
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel

          cache_args=()
          if [ "${{ inputs.use_cache }}" = "true" ]; then
            cache_args+=(--disk_cache="$HOME/.cache/bazel")
          fi
          tools/bazel build --config=fast "${cache_args[@]}" \
            //common:kernel_aarch64/Image

      - name: Verify output and prepare package
        shell: bash
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/kernel/bazel-bin/common/kernel_aarch64/Image"
          test -s "$image"

          version="$(strings "$image" | grep -m1 '^Linux version ' || true)"
          echo "$version"
          if ! grep -Eq '^Linux version 6\.12\.69-android16-6(-| )' <<< "$version"; then
            echo "Built Image does not report the expected KMI generation" >&2
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$image" "$GITHUB_WORKSPACE/out/Image"
          bash kernel/common/scripts/extract-ikconfig "$image" > out/kernel.config
          bash myron/verify-config.sh out/kernel.config
          cp "$GITHUB_WORKSPACE/kernel/common/arch/arm64/configs/gki_defconfig" \
            "$GITHUB_WORKSPACE/out/gki_defconfig"
          {
            echo "common_tag=${COMMON_TAG}"
            echo "common_commit=${COMMON_COMMIT}"
            echo "droidspaces_commit=${DROIDSPACES_COMMIT}"
            echo "anykernel_commit=${ANYKERNEL_COMMIT}"
            echo "baseline_status=candidate; OEM commit b1493ec68d4a not matched"
            echo "device_boot_test=not performed"
            echo "target=myron (Redmi K90 Pro Max / POCO F8 Ultra)"
            echo "page_size=4K"
            echo "root=external KernelSU LKM; no built-in KSU"
          } > "$GITHUB_WORKSPACE/out/BUILD-INFO.txt"

      - name: Build AnyKernel3 package
        shell: bash
        run: |
          set -euo pipefail
          git init AnyKernel3
          git -C AnyKernel3 remote add origin https://github.com/WildKernels/AnyKernel3.git
          git -C AnyKernel3 fetch --depth=1 origin "$ANYKERNEL_COMMIT"
          git -C AnyKernel3 checkout --detach FETCH_HEAD
          test "$(git -C AnyKernel3 rev-parse HEAD)" = "$ANYKERNEL_COMMIT"
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cp out/Image AnyKernel3/Image
          cp out/BUILD-INFO.txt out/kernel.config AnyKernel3/
          cp myron/check-device.sh AnyKernel3/
          python3 myron/guard-installer.py AnyKernel3/anykernel.sh
          (cd AnyKernel3 && sha256sum Image kernel.config BUILD-INFO.txt anykernel.sh check-device.sh > SHA256SUMS)
          (cd AnyKernel3 && zip -r9 ../out/myron-droidspaces-6.12.69-android16-6-4k-AnyKernel3.zip .)
          (cd out && sha256sum Image kernel.config gki_defconfig manifest.xml BUILD-INFO.txt *.zip > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myron-droidspaces-6.12.69-android16-6-4k
          path: out/
          if-no-files-found: error
          compression-level: 9
